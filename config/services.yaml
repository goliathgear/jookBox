# A showcase of the homelab world, in homepage's services.yaml format:
# https://gethomepage.dev/configs/services/
#
# Each service is a title strip: the name is the song title, the description
# is the artist. Swap these for your own services (see README, "Your own
# links"); a group is a page, and a long group runs on to the next one.

- Virtualization:
    - Proxmox VE:
        href: https://pve.proxmox.com/pve-docs/
        description: Hypervisor documentation
        icon: proxmox.png
    - Proxmox forum:
        href: https://forum.proxmox.com/
        description: Community help
        icon: proxmox.png
